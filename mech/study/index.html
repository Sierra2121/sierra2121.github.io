function go(p){page=p;filter='';search='';quiz=null;render()}function due(){return data.questions.filter(q=>q.due<=now())}function mistakes(){return data.questions.filter(q=>q.errors>0&&q.streak<2)}function matched(a){return a.filter(x=>(!filter||x.subject===filter)&&(!search||JSON.stringify(x).toLowerCase().includes(search.toLowerCase())))}

function flashHtml(){let list=matched(data.cards).filter(c=>c.due<=now());let c=list[flashIndex%Math.max(1,list.length)];if(!c)return '<div class="empty">今日記憶卡已完成。</div>';return '<p>'+list.length+' 張待複習 · '+esc(c.subject)+'</p><div class="flash" role="button" tabindex="0" onclick="flipped=!flipped;render()" onkeydown="if(event.key===\'Enter\'){flipped=!flipped;render()}">'+esc(flipped?c.back:c.front)+'<p class="muted" style="font-size:13px">點擊翻面</p></div><div class="row" style="margin-top:14px"><button onclick="rateCard(\''+c.id+'\',false)">不熟悉</button><button class="primary" onclick="rateCard(\''+c.id+'\',true)">記住了</button><button onclick="flashIndex++;flipped=false;render()">跳過</button></div>'}

function beginExam(){let qs=matched(data.questions),count=Math.max(1,Math.min(qs.length,+$('#examCount').value||20)),mins=Math.max(1,Math.min(180,+$('#examMinutes').value||30));if(!qs.length)return alert('沒有符合的題目');exam={qs:qs.slice().sort(()=>Math.random()-.5).slice(0,count),answers:{},i:0,end:now()+mins*60000,subject:filter||'所有科目'};examTimer=setInterval(()=>{if(!exam)return;let t=$('#clock');if(t)t.textContent=timeLeft();if(now()>=exam.end)finishExam()},500);render()}
function timeLeft(){let t=Math.max(0,Math.ceil((exam.end-now())/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function examHtml(){if(exam.result)return '<div class="card"><h2>考試結果</h2><div class="number">'+exam.result.score+' / '+exam.qs.length+'</div>'+exam.qs.map((q,i)=>'<div class="item"><b>'+(exam.answers[i]===q.answer?'✓':'✗')+' '+esc(q.text)+'</b><p>你的答案：'+esc(q.options[exam.answers[i]]||'未作答')+'｜正解：'+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p></div>').join('')+'<button class="primary" onclick="go(\'exam\')">返回</button></div>';let q=exam.qs[exam.i];return '<div class="card"><div class="row between"><span>'+ (exam.i+1)+' / '+exam.qs.length+'</span><span id="clock" class="timer">'+timeLeft()+'</span></div><h2>'+esc(q.text)+'</h2>'+imageHtml(q)+q.options.map((o,i)=>'<button class="option '+(exam.answers[exam.i]===i?'correct':'')+'" onclick="exam.answers[exam.i]='+i+';render()">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'<div class="row"><button onclick="exam.i=Math.max(0,exam.i-1);render()">上一題</button><button onclick="exam.i=Math.min(exam.qs.length-1,exam.i+1);render()">下一題</button><button class="primary" onclick="if(confirm(\'確定交卷？\'))finishExam()">交卷</button></div><p>已作答 '+Object.keys(exam.answers).length+' 題</p></div>'}
function finishExam(){clearInterval(examTimer);if(exam.result)return;let score=0;exam.qs.forEach((q,i)=>{let ok=exam.answers[i]===q.answer;if(ok){score++;q.streak++;q.due=now()+[1,3,7,14,30][Math.min(q.streak-1,4)]*day}else{q.errors++;q.streak=0;q.due=now()+day}data.history.push({id:q.id,correct:ok,date:now()})});exam.result={score,total:exam.qs.length,date:now(),subject:exam.subject};data.exams.push(exam.result);save();render()}

function csvRows(s){let rows=[],r=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c==='\n')){r.push(v);v='';if(c==='\n'){rows.push(r);r=[]}}else if(c!=='\r'||quoted)v+=c}r.push(v);rows.push(r);return rows}
async function xlsxRows(file){let b=new Uint8Array(await file.arrayBuffer()),d=new DataView(b.buffer),files={};let end=b.length-22;while(end>=0&&d.getUint32(end,true)!==0x06054b50)end--;if(end<0)throw Error('無法讀取 Excel');let p=d.getUint32(end+16,true),n=d.getUint16(end+10,true);for(let i=0;i<n;i++){let method=d.getUint16(p+10,true),size=d.getUint32(p+20,true),nl=d.getUint16(p+28,true),el=d.getUint16(p+30,true),cl=d.getUint16(p+32,true),off=d.getUint32(p+42,true),name=new TextDecoder().decode(b.slice(p+46,p+46+nl));let st=off+30+d.getUint16(off+26,true)+d.getUint16(off+28,true);if(name.endsWith('.xml')){let part=b.slice(st,st+size);files[name]=new TextDecoder().decode(method===0?part:await new Response(new Blob([part]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}p+=46+nl+el+cl}let parse=x=>new DOMParser().parseFromString(x,'application/xml'),strings=files['xl/sharedStrings.xml']?[...parse(files['xl/sharedStrings.xml']).getElementsByTagName('si')].map(x=>x.textContent):[],sheet=files['xl/worksheets/sheet1.xml'];if(!sheet)throw Error('第一張工作表不存在');return [...parse(sheet).getElementsByTagName('row')].map(row=>{let a=[];for(let c of row.getElementsByTagName('c')){let ref=c.getAttribute('r')||'A1',i=0;for(let ch of ref.match(/^[A-Z]+/)[0])i=i*26+ch.charCodeAt(0)-64;let t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0]?.textContent||'';a[i-1]=t==='s'?strings[+v]:t==='inlineStr'?c.getElementsByTagName('is')[0]?.textContent:v}return a})}
async function bulkImport(input){try{let f=input.files[0];if(!f)return;let rows=f.name.endsWith('.xlsx')?await xlsxRows(f):csvRows((await f.text()).replace(/^\ufeff/,''));let head=rows.shift().map(s=>String(s||'').trim());if(!cols.slice(0,8).every(c=>head.includes(c)))throw Error('欄位不符合範本');let added=[],bad=0;for(let row of rows){if(!row.some(Boolean))continue;let get=k=>String(row[head.indexOf(k)]||'').trim(),s=get('科目'),text=get('題目'),options=['A','B','C','D'].map(get),answer='ABCD'.indexOf(get('答案').toUpperCase());if(!s||!text||options.some(x=>!x)||answer<0||get('答案').length!==1){bad++;continue}added.push({id:uid(),subject:s,text,options,answer,explanation:get('解析'),year:get('年度'),source:get('來源'),whys:['A解析','B解析','C解析','D解析'].map(get),due:0,errors:0,streak:0})}if(!added.length)throw Error('沒有有效題目');if(confirm('新增 '+added.length+' 題，略過 '+bad+' 筆無效資料？')){for(let q of added)if(!data.subjects.includes(q.subject))data.subjects.push(q.subject);data.questions.push(...added);save();render()}}catch(e){alert('匯入失敗：'+e.message)}input.value=''}
