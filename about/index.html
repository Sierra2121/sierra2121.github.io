<!DOCTYPE html>
<!-- 頁面：關於我｜網址：/about/ -->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關於我｜Sierra・為什麼研究室</title>
<meta name="description" content="社工系讓我學會了解他人，國考讓我學會邏輯。工地、機械組裝、PLC、SEO、餐飲、網站架設，每段經歷都接在邏輯線或了解他人線上，最後一起點亮 Sierra 這顆燈。">
<meta property="og:title" content="關於我｜為什麼研究室">
<meta property="og:description" content="兩條電線：邏輯，和了解他人。兩條都接上，燈才會亮。">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ebdd;
    --bg2: #e8dfcc;
    --metal: #3a3e43;
    --metal-hi: #52575d;
    --metal-lo: #2a2d31;
    --text: #2a2621;
    --muted: #6e665a;
    --hazard: #946500;
    --wire-off: #4a4f55;
    --logic: #4ea6ff;        /* 邏輯線：藍 */
    --people: #ff8a4c;       /* 了解他人線：橘 */
    --lamp: #fff1c2;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --lead: #4a443b;
    --soft: #5a5348;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.8; font-size: 16px;
  }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .hazard-strip { height: 10px; background: repeating-linear-gradient(-45deg, var(--hazard) 0 14px, #111 14px 28px); }

  /* 導覽列（跟首頁一樣） */
  header { border-bottom: 1px solid var(--line); }
  nav { display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .logo { font-weight: 900; font-size: 20px; text-decoration: none; }
  .logo small { font-family: var(--mono); font-size: 11px; color: var(--hazard); margin-left: 8px; letter-spacing: .1em; }
  nav ul { display: flex; gap: 22px; list-style: none; font-size: 14px; }
  nav ul a { text-decoration: none; color: var(--muted); }
  nav ul a:hover, nav ul a[aria-current] { color: var(--hazard); }
  @media (max-width: 640px) { nav ul { display: none; } }

  /* 開場 */
  .intro { padding: 48px 0 28px; }
  .code { font-family: var(--mono); color: var(--hazard); font-size: 12px; letter-spacing: .2em; }
  .intro h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 900; line-height: 1.3; margin: 4px 0 14px; }
  .intro .story { color: var(--muted); max-width: 640px; }
  .intro .story b { color: var(--text); font-weight: 500; }
  .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 18px; font-size: 14px; }
  .legend i { display: inline-block; width: 26px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 8px; }

  /* 送電開關 */
  .breakers { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brk {
    display: flex; align-items: center; gap: 10px; cursor: pointer; font: inherit; color: var(--text);
    background: linear-gradient(160deg, var(--metal-hi), var(--metal) 45%, var(--metal-lo));
    border: 1px solid #111; border-radius: 6px; padding: 6px 12px 6px 8px; font-size: 13px;
  }
  .brk:focus-visible { outline: 3px solid var(--hazard); outline-offset: 3px; }
  .lever { width: 22px; height: 34px; background: #111; border-radius: 3px; position: relative; flex: none; }
  .lever::after {
    content: ""; position: absolute; left: 3px; right: 3px; height: 14px; border-radius: 2px;
    top: 3px; background: var(--c); transition: top .15s, background .15s;
  }
  .brk[aria-pressed="false"] .lever::after { top: 17px; background: #666; }
  .brk .st { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .brk[data-wire="logic"] { --c: var(--logic); }
  .brk[data-wire="people"] { --c: var(--people); }

  /* 配線板 */
  .board {
    position: relative; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    padding: 24px 20px; display: grid; column-gap: 0;
    grid-template-columns: repeat(36, minmax(0, 1fr)) 170px repeat(36, minmax(0, 1fr));
    grid-template-rows: auto 150px auto;
  }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wire { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s; }
  .lead { fill: none; stroke-width: 3; transition: stroke .3s; }
  .flow { fill: none; stroke-width: 3; stroke-dasharray: 3 15; stroke-linecap: round; stroke: #fff; opacity: .85;
          animation: flow .7s linear infinite; transition: opacity .3s; }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .g-logic .wire, .g-logic .lead { stroke: var(--logic); }
  .g-people .wire, .g-people .lead { stroke: var(--people); }
  .g-logic .term { fill: var(--logic); } .g-people .term { fill: var(--people); }
  .term { stroke: #111; stroke-width: 2; }
  .off .wire, .off .lead { stroke: var(--wire-off); }
  .off .term { fill: var(--wire-off); }
  .off .flow { opacity: 0; }

  .node {
    position: relative; z-index: 1; font: inherit; color: var(--text); text-align: left; cursor: pointer;
    background: #141617; border: 2px solid var(--wc); border-radius: 6px; padding: 10px 10px 12px;
    display: flex; flex-direction: column; gap: 2px; transition: transform .15s, box-shadow .15s, border-color .3s;
  }
  .node.logic { --wc: var(--logic); } .node.people { --wc: var(--people); } .node.both { --wc: var(--hazard); }
  .node .no { font-family: var(--mono); font-size: 10px; color: var(--wc); letter-spacing: .08em; }
  .node .nm { font-weight: 900; font-size: 17px; line-height: 1.4; }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--logic); border: 1px solid var(--logic); border-radius: 3px; padding: 0 4px; vertical-align: middle; margin-left: 4px; }
  .node .tg { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .node:hover, .node:focus-visible, .node.sel { transform: translateY(-2px); box-shadow: 0 0 0 3px rgba(242,194,48,.35), 0 8px 18px rgba(0,0,0,.4); outline: none; }
  .board.dim-logic .node.logic, .board.dim-people .node.people { border-color: var(--wire-off); }
  .board.dim-logic .node.logic .no, .board.dim-people .node.people .no { color: var(--muted); }

  .top { grid-row: 1; align-self: end; }
  .bot { grid-row: 3; align-self: start; }
  /* 每張卡片一樣寬（12 格）；L 上下交錯，所以每張只往右錯 7 格，間距比 P 小，L-04 和網站架設之間留空 */
  #n-exam { grid-column: 1 / span 12; } #n-site { grid-column: 8 / span 12; } #n-mech { grid-column: 15 / span 12; } #n-plc { grid-column: 22 / span 12; }
  .node.logic { margin-right: 10px; } .node.people { margin-left: 10px; }
  #n-seo { grid-column: 38 / span 12; } #n-food { grid-column: 50 / span 12; } #n-sw { grid-column: 62 / span 12; }
  #n-web { grid-column: 37; grid-row: 3; align-self: start; margin-top: 34px; }
  .lampbox { grid-column: 37; grid-row: 2; display: grid; place-items: center; position: relative; z-index: 1; }
  .center-note { grid-column: 37; grid-row: 1; align-self: end; text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 6px; }

  /* Sierra 燈 */
  .lamp { text-align: center; }
  .plate {
    display: inline-block; background: #e8e4d8; color: #1d1d1d; font-size: 12px; font-weight: 700;
    padding: 1px 10px; border-radius: 2px; margin-bottom: 8px; letter-spacing: .12em; font-family: var(--mono);
  }
  #bulb {
    width: 86px; height: 86px; border-radius: 50%; margin: 0 auto; border: 5px solid #1b1b1b;
    background: radial-gradient(circle at 40% 35%, #5a5548, #2c2a24);
    box-shadow: 0 0 0 6px #33363a, inset 0 -6px 10px rgba(0,0,0,.4);
    transition: background .4s, box-shadow .4s;
  }
  #bulb.on {
    background: radial-gradient(circle at 40% 35%, #fff, var(--lamp) 45%, #ffd36b);
    box-shadow: 0 0 0 6px #33363a, 0 0 28px 8px rgba(255,225,140,.55), 0 0 70px 20px rgba(255,210,110,.25);
  }
  .lamp .code-tag { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 8px; display: block; }

  /* 說明窗 */
  .msg {
    margin-top: 14px; background: #0f1112; border: 1px solid #000; border-radius: 6px;
    padding: 14px 16px; min-height: 96px; font-size: 15px;
  }
  .msg .hd { font-family: var(--mono); font-size: 12px; color: var(--hazard); margin-bottom: 4px; }
  .msg .hd::before { content: "> "; color: var(--muted); }

  .back { display: inline-block; margin: 36px 0 56px; font-family: var(--mono); font-size: 13px; color: var(--hazard); text-decoration: none; border: 1px dashed var(--hazard); padding: 6px 12px; }
  .back:hover { background: rgba(242,194,48,.1); }
  footer { padding: 30px 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  /* 手機：兩條線由上往下，流向最底下的燈 */
  @media (max-width: 760px) {
    .board { grid-template-columns: 1fr 1fr; grid-template-rows: none; column-gap: 28px; row-gap: 26px; padding: 26px 14px 30px; }
    .top, .bot { grid-row: auto; align-self: auto; }
    .node.logic, .node.people { margin: 0; }
    #n-exam { grid-column: 1; grid-row: 1; } #n-site { grid-column: 1; grid-row: 2; }
    #n-mech { grid-column: 1; grid-row: 3; } #n-plc  { grid-column: 1; grid-row: 4; }
    #n-sw   { grid-column: 2; grid-row: 1; } #n-food { grid-column: 2; grid-row: 2; } #n-seo { grid-column: 2; grid-row: 3; }
    #n-web  { grid-column: 1 / 3; grid-row: 5; margin: 0; }
    .lampbox { grid-column: 1 / 3; grid-row: 6; padding-top: 10px; }
    .center-note { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }

  /* 米色底：機械與控制盤保持深色金屬 */
  .hazard-strip { --hazard: #f2c230; }
  .brk, .lever, .node, .msg { --bg:#17191b;--bg2:#1f2225;--bg3:#0f1112;--line:#2c2f33;--text:#e9e6df;--muted:#9a978f;--hazard:#f2c230;--amber:#ffb347;--red:#ff4b3e;--wire-on:#ffb347;--lead:#d8d4cb;--soft:#cfcac0; color: var(--text); }
</style>
</head>
<body>

<div class="hazard-strip"></div>
<header>
  <nav class="wrap">
    <a class="logo" href="/">為什麼研究室<small>SIERRA</small></a>
    <ul>
      <li><a href="/#mech">機電</a></li>
      <li><a href="/#seo">SEO</a></li>
      <li><a href="/about/" aria-current="page">關於我</a></li>
      <li><a href="/#log">日誌</a></li>
      <li><a href="/#contact">聯絡</a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  <div class="intro">
    <p class="code">BOX No.03</p>
    <h1>兩條線，一顆燈</h1>
    <p class="story">
      <b>社工系讓我學會了解他人，國考讓我學會邏輯。</b><br>
      工地讓我看見邏輯怎麼變成運轉，SEO 讓我學會用文字了解他人。<br>
      每一段都不是轉行，而是同一條路。
    </p>
    <div class="legend">
      <span><i style="background:var(--logic)"></i>邏輯線</span>
      <span><i style="background:var(--people)"></i>了解他人線</span>
      <span><i style="background:var(--hazard)"></i>兩條線的交會</span>
    </div>
  </div>

  <div class="breakers">
    <button class="brk" data-wire="logic" aria-pressed="true"><span class="lever"></span><span>邏輯線<br><span class="st">ON</span></span></button>
    <button class="brk" data-wire="people" aria-pressed="true"><span>了解他人線<br><span class="st">ON</span></span><span class="lever"></span></button>
  </div>

  <div class="board" id="board">
    <svg id="wires" aria-hidden="true">
      <g class="g-logic" id="gLogic"></g>
      <g class="g-people" id="gPeople"></g>
    </svg>

    <!-- 邏輯線：L-01 在線頭，電流依序流過 1→4 再到 Sierra -->
    <button class="node logic bot" id="n-plc" data-wire="logic">
      <span class="no">L-04</span><span class="nm">PLC</span><span class="tg">從「怎麼運作」到「為什麼」</span>
      <span class="sr full">PLC 讓我開始從「設備怎麼運作」，進一步思考「設備為什麼會這樣運作」，也開始理解控制邏輯如何轉換成實際的設備動作。</span>
    </button>
    <button class="node logic top" id="n-mech" data-wire="logic">
      <span class="no">L-03</span><span class="nm">機械組裝</span><span class="tg">精度決定整體</span>
      <span class="sr full">機械組裝讓我更直接感受到，一台設備是由許多零件共同組成，每個零件的位置、精度與安裝方式，都可能影響整體運作。</span>
    </button>
    <button class="node logic bot" id="n-site" data-wire="logic">
      <span class="no">L-02</span><span class="nm">工地</span><span class="tg">看見邏輯變成運轉</span>
      <span class="sr full">在工地實際接觸配管、配線與設備施工後，開始看見原本抽象的邏輯，如何透過實際配置讓整個系統運轉起來。</span>
    </button>
    <button class="node logic top" id="n-exam" data-wire="logic">
      <span class="no">L-01</span><span class="nm">國考</span><span class="tg">學會邏輯</span>
      <span class="sr full">從準備國考開始，我逐漸培養分析問題、整理資訊與建立邏輯的能力。</span>
    </button>

    <p class="center-note">兩條都接上<br>燈才會亮</p>

    <div class="lampbox">
      <div class="lamp">
        <span class="plate">SIERRA</span>
        <div id="bulb" role="img" aria-label="Sierra 指示燈"></div>
        <span class="code-tag">PL</span>
      </div>
    </div>

    <button class="node both" id="n-web" data-wire="both">
      <span class="no">L+P</span><span class="nm">網站架設</span><span class="tg">把想法變成能使用的系統</span>
      <span class="sr full">網站架設同時結合了「邏輯」與「理解他人」：一方面要思考網站的架構、功能與流程，另一方面也要站在使用者的角度思考需求。最後，再把一個抽象的想法，轉換成實際可以使用的系統。</span>
    </button>

    <!-- 了解他人線：P-01 在線頭，依序流過 1→3 再到 Sierra -->
    <button class="node people top" id="n-sw" data-wire="people">
      <span class="no">P-01</span><span class="nm">社工系</span><span class="tg">學會理解他人</span>
      <span class="sr full">社工的學習讓我開始接觸人的需求與想法，學著從不同角度理解一個人的行為與選擇。</span>
    </button>
    <button class="node people bot" id="n-food" data-wire="people">
      <span class="no">P-02</span><span class="nm">餐飲</span><span class="tg">理解環環相扣的配合</span>
      <span class="sr full">餐飲工作讓我感受到，一個看似簡單的成果，其實需要許多環節彼此配合。從備料、製作到出餐，每個環節都會影響下一個環節。</span>
    </button>
    <button class="node people top" id="n-seo" data-wire="people">
      <span class="no">P-03</span><span class="nm">SEO</span><span class="tg">用文字理解系統及他人</span>
      <span class="sr full">SEO 讓我發現，搜尋一個關鍵字的背後，其實代表著一個人的需求。寫文章時要看懂 Google 的規則，但同時也要站在人的角度去寫。透過搜尋意圖、關鍵字與內容，我開始學習從文字理解系統，也理解使用者真正想找的是什麼。</span>
    </button>
  </div>

  <div class="msg" id="msg" aria-live="polite">
    <p class="hd" id="msgHd">送電中…</p>
    <p id="msgBody">把滑鼠移到線上的端子（手機用點的），看每一段經歷帶給我什麼。也可以試著關掉上面其中一個開關。</p>
  </div>


  <a class="back" href="/">← 回到控制盤</a>
</main>

<div class="hazard-strip"></div>
<footer>
  <div class="wrap">© 2026 為什麼研究室 ・ SIERRA</div>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const board = $("board");
  const NS = "http://www.w3.org/2000/svg";
  const on = { logic: true, people: true };
  const name = { logic: "邏輯線", people: "了解他人線", both: "兩條線的交會" };

  // 取得元素在配線板裡的位置
  function box(el) {
    const r = el.getBoundingClientRect(), b = board.getBoundingClientRect();
    const l = r.left - b.left, t = r.top - b.top;
    return { l, t, r: l + r.width, b: t + r.height, x: l + r.width / 2, y: t + r.height / 2 };
  }
  function add(g, tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    g.appendChild(el);
  }

  // 畫線：主線 → 端子 → 燈
  function draw() {
    const W = board.clientWidth, H = board.clientHeight;
    $("wires").setAttribute("viewBox", `0 0 ${W} ${H}`);
    const gL = $("gLogic"), gP = $("gPeople");
    gL.innerHTML = ""; gP.innerHTML = "";
    const lamp = box($("bulb")), web = box($("n-web"));
    const mobile = matchMedia("(max-width: 760px)").matches;
    const groups = { logic: gL, people: gP };

    if (!mobile) {
      const y = lamp.y;
      const main = { logic: `M0 ${y} H${lamp.l}`, people: `M${W} ${y} H${lamp.r}` };
      for (const w in main) add(groups[w], "path", { class: "wire", d: main[w] });
      // 每個端子的引線
      document.querySelectorAll(".node.logic, .node.people").forEach(n => {
        const c = box(n), g = groups[n.dataset.wire];
        const edge = n.classList.contains("top") ? c.b : c.t;
        add(g, "path", { class: "lead", d: `M${c.x} ${edge} V${y}` });
        add(g, "circle", { class: "term", cx: c.x, cy: y, r: 6 });
      });
      // 網站架設：兩條線各拉一條分支過來
      const xl = lamp.l - 22, xr = lamp.r + 22;
      add(gL, "path", { class: "lead", d: `M${xl} ${y} V${web.y} H${web.l}` });
      add(gP, "path", { class: "lead", d: `M${xr} ${y} V${web.y} H${web.r}` });
      add(gL, "circle", { class: "term", cx: xl, cy: y, r: 5 });
      add(gP, "circle", { class: "term", cx: xr, cy: y, r: 5 });
      for (const w in main) add(groups[w], "path", { class: "flow", d: main[w] });
    } else {
      // 手機：兩條線由上往下，穿過每個端子，最後接進燈的左右兩側
      const xL = box($("n-exam")).x, xP = box($("n-sw")).x;
      const main = {
        logic: `M${xL} 0 V${lamp.y} H${lamp.l}`,
        people: `M${xP} 0 V${lamp.y} H${lamp.r}`
      };
      for (const w in main) {
        add(groups[w], "path", { class: "wire", d: main[w] });
        add(groups[w], "path", { class: "flow", d: main[w] });
      }
      document.querySelectorAll(".node.logic, .node.people").forEach(n => {
        const c = box(n), g = groups[n.dataset.wire];
        add(g, "circle", { class: "term", cx: c.x, cy: c.t, r: 5 });
        add(g, "circle", { class: "term", cx: c.x, cy: c.b, r: 5 });
      });
      add(gL, "circle", { class: "term", cx: xL, cy: web.t, r: 5 });
      add(gP, "circle", { class: "term", cx: xP, cy: web.t, r: 5 });
    }
  }

  // 燈：兩條線都通才亮
  let started = false;
  function update(note) {
    $("gLogic").classList.toggle("off", !on.logic);
    $("gPeople").classList.toggle("off", !on.people);
    board.classList.toggle("dim-logic", !on.logic);
    board.classList.toggle("dim-people", !on.people);
    const lit = on.logic && on.people && started;
    $("bulb").classList.toggle("on", lit);
    document.querySelectorAll(".brk").forEach(b => {
      const w = b.dataset.wire;
      b.setAttribute("aria-pressed", on[w]);
      b.querySelector(".st").textContent = on[w] ? "ON" : "OFF";
    });
    if (!note) return;
    if (lit) show("迴路閉合", "兩條線都接上了，Sierra 亮起來。邏輯讓事情跑得動，了解他人讓事情有人用得上，少一條都不行。");
    else if (!on.logic && !on.people) show("兩條都斷開", "沒有線，當然不會亮。");
    else {
      const left = on.logic ? "邏輯線" : "了解他人線";
      show("迴路沒有閉合", `只剩${left}，電流沒有回來的路，燈不會亮。只有其中一種能力，也還不夠。`);
    }
  }
  function show(hd, body) { $("msgHd").textContent = hd; $("msgBody").textContent = body; }

  document.querySelectorAll(".brk").forEach(b => b.addEventListener("click", () => {
    on[b.dataset.wire] = !on[b.dataset.wire];
    update(true);
  }));

  // 端子：移上去或點一下，顯示完整故事
  let sel = null;
  document.querySelectorAll(".node").forEach(n => {
    const pick = () => {
      if (sel) sel.classList.remove("sel");
      sel = n; n.classList.add("sel");
      show(`${name[n.dataset.wire]}｜${n.querySelector(".nm").textContent}｜${n.querySelector(".tg").textContent}`,
           n.querySelector(".full").textContent);
    };
    n.addEventListener("mouseenter", pick);
    n.addEventListener("focus", pick);
    n.addEventListener("click", pick);
  });

  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(draw, 80); });
  document.fonts && document.fonts.ready.then(draw);
  draw();
  update();
  // 開場：送電一下，燈才亮
  setTimeout(() => { started = true; update(true); }, 900);
})();
</script>
</body>
</html>
