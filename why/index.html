<!DOCTYPE html>
<!-- 頁面：為什麼｜網址：/why/ -->
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>為什麼｜Sierra・為什麼研究室</title>
<meta name="description" content="生活裡冒出來的為什麼，和 Sierra 查到或想到的答案。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2ebdd;
    --bg2: #e8dfcc;
    --card: #faf6ec;
    --text: #2a2621;
    --muted: #6e665a;
    --hazard: #946500;
    --line: #d8ccb4;
    --accent: #c4552b;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Noto Sans TC", system-ui, sans-serif; line-height: 1.8; font-size: 16px; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* 全站共用：警示條紋、導覽列、頁尾 */
  .hazard-strip { height: 10px; background: repeating-linear-gradient(-45deg, #f2c230 0 14px, #111 14px 28px); }
  header { border-bottom: 1px solid var(--line); }
  nav { display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .logo { font-weight: 900; font-size: 20px; text-decoration: none; letter-spacing: .02em; }
  .logo small { font-family: var(--mono); font-size: 11px; color: var(--hazard); margin-left: 8px; letter-spacing: .1em; }
  nav ul { display: flex; gap: 22px; list-style: none; font-size: 14px; }
  nav ul a { text-decoration: none; color: var(--muted); }
  nav ul a:hover, nav ul a[aria-current] { color: var(--hazard); }
  @media (max-width: 640px) { nav ul { display: none; } }
  footer { padding: 30px 0; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  main { max-width: 820px; }
  .head { padding: 44px 0 22px; }
  .head h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 900; line-height: 1.3; }
  .head h1 span { color: var(--accent); }
  .head p { color: var(--muted); margin-top: 6px; }

  /* 標籤 */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 22px; }
  .tag {
    font: 500 14px "Noto Sans TC", sans-serif; cursor: pointer; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #cdbd9e; background: transparent; color: var(--muted); transition: background .12s, color .12s;
  }
  .tag:hover { color: var(--text); border-color: #a8987a; }
  .tag[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .tag .n { font-family: var(--mono); font-size: 11px; margin-left: 4px; opacity: .7; }
  .tag:disabled { opacity: .4; cursor: default; }
  .tag:focus-visible, .q:focus-visible { outline: 3px solid var(--hazard); outline-offset: 2px; }
  .status { font-size: 13px; color: var(--muted); margin: -8px 0 12px; min-height: 1.6em; }
  .status button { font: inherit; color: var(--accent); background: none; border: none; cursor: pointer; text-decoration: underline; }

  /* 問答 */
  .list { list-style: none; border-top: 1px solid var(--line); margin-bottom: 60px; }
  .item { border-bottom: 1px solid var(--line); }
  .q {
    width: 100%; display: grid; grid-template-columns: 58px 1fr 22px; gap: 10px; align-items: baseline;
    background: none; border: none; cursor: pointer; text-align: left; padding: 16px 4px; color: var(--text);
    font: 500 17px/1.6 "Noto Sans TC", sans-serif;
  }
  .q:hover .qt { color: var(--accent); }
  .no { font-family: var(--mono); font-size: 12px; color: #a89b85; }
  .chev { font-family: var(--mono); color: var(--muted); transition: transform .2s; justify-self: end; }
  .item.open .chev { transform: rotate(90deg); color: var(--accent); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 4px 14px 72px; margin-top: -8px; font-size: 13px; color: var(--muted); }
  .meta .ht { color: var(--accent); cursor: pointer; background: none; border: none; font: inherit; padding: 0; }
  .meta .ht:hover { text-decoration: underline; }
  .meta time { font-family: var(--mono); font-size: 12px; color: #a89b85; }
  .ans { display: none; padding: 2px 8px 22px 72px; color: #3d372f; }
  .item.open .ans { display: block; }
  .ans p + p { margin-top: .8em; }
  .empty { padding: 50px 0; color: var(--muted); text-align: center; }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  @media (max-width: 640px) {
    .q { grid-template-columns: 1fr 18px; } .q .no { display: none; }
    .meta, .ans { padding-left: 4px; }
  }
</style>
</head>
<body>

<div class="hazard-strip"></div>
<header>
  <nav class="wrap">
    <a class="logo" href="/">為什麼研究室<small>SIERRA</small></a>
    <ul>
      <li><a href="/#mech">機電</a></li>
      <li><a href="/#seo">SEO</a></li>
      <li><a href="/diary/">日記</a></li>
      <li><a href="/why/" aria-current="page">為什麼</a></li>
    </ul>
  </nav>
</header>

<main class="wrap">
  <div class="head">
    <h1>為什麼<span>？</span></h1>
    <p>生活裡冒出來的問題，和我查到或想到的答案。</p>
  </div>

  <div class="tags" id="tags" aria-label="用標籤篩選"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <ol class="list" id="list"></ol>
</main>

<div class="hazard-strip"></div>
<footer>
  <div class="wrap">© 2026 為什麼研究室 ・ SIERRA</div>
</footer>

<script>
/*
  ── 標籤清單 ──
  要新增標籤（例如 錢、能源、機電），加在這裡。
  規則：每題掛 1～3 個；新標籤至少要能用在 2～3 題才開。
*/
const TAGS = ["宇宙", "氣候", "生物", "身體", "數位", "AI", "規則", "心理", "文化", "語言"];

/*
  ── 寫為什麼的地方 ──
  每一題照下面的格式加一組 { }。順序不用排，頁面會自動依日期由舊到新排。
  date：寫的日期（YYYY-MM-DD）
  q：問題
  tags：標籤，1～3 個，要跟上面的 TAGS 一模一樣
  a：答案。分段就空一行，用反引號 ` ` 包起來。

  例：
  {
    date: "2026-10-01",
    q: "為什麼……？",
    tags: ["規則", "心理"],
    a: `第一段……

第二段……`
  },
*/
const whys = [

];
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const list = whys
    .filter(w => w && w.q)
    .map((w, i) => ({ ...w, tags: (w.tags || []).filter(t => TAGS.includes(t)), _i: i }))
    .sort((a, b) => (a.date || "").localeCompare(b.date || "") || a._i - b._i);
  list.forEach((w, i) => (w.no = "Q-" + String(i + 1).padStart(3, "0")));
  let active = null;

  // 標籤按鈕
  const count = t => list.filter(w => w.tags.includes(t)).length;
  $("tags").innerHTML = TAGS.map(t => {
    const n = count(t);
    return `<button class="tag" data-tag="${esc(t)}" aria-pressed="false"${n ? "" : " disabled"}>#${esc(t)}<span class="n">${n}</span></button>`;
  }).join("");
  $("tags").addEventListener("click", e => {
    const b = e.target.closest(".tag");
    if (b && !b.disabled) pick(b.dataset.tag);
  });

  function pick(t) {
    active = active === t ? null : t;
    document.querySelectorAll(".tag").forEach(b => b.setAttribute("aria-pressed", b.dataset.tag === active));
    render();
  }

  function render() {
    const shown = active ? list.filter(w => w.tags.includes(active)) : list;
    $("status").innerHTML = active
      ? `#${esc(active)}：${shown.length} 題　<button type="button" id="clear">看全部</button>`
      : list.length ? `共 ${list.length} 題，最早寫的在最上面。` : "";
    const c = $("clear"); if (c) c.addEventListener("click", () => pick(active));

    if (!list.length) {
      $("list").innerHTML = `<li class="empty"><b>第一個為什麼還沒寫</b>問題會從這裡開始累積。</li>`;
      return;
    }
    $("list").innerHTML = shown.map(w => {
      const paras = String(w.a || "").trim().split(/\n\s*\n/).filter(Boolean)
        .map(p => `<p>${esc(p).replace(/\n/g, "<br>")}</p>`).join("") || "<p>（答案還在想）</p>";
      return `<li class="item">
        <button class="q" aria-expanded="false"><span class="no">${w.no}</span><span class="qt">${esc(w.q)}</span><span class="chev">›</span></button>
        <div class="meta">${w.tags.map(t => `<button class="ht" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}${w.date ? `<time>${esc(w.date.replace(/-/g, "."))}</time>` : ""}</div>
        <div class="ans">${paras}</div>
      </li>`;
    }).join("");
  }

  $("list").addEventListener("click", e => {
    const q = e.target.closest(".q");
    if (q) {
      const item = q.parentElement, open = !item.classList.contains("open");
      item.classList.toggle("open", open);
      q.setAttribute("aria-expanded", open);
      return;
    }
    const h = e.target.closest(".ht");
    if (h) { if (active !== h.dataset.tag) pick(h.dataset.tag); window.scrollTo({ top: 0, behavior: "smooth" }); }
  });

  render();
})();
</script>
</body>
</html>
